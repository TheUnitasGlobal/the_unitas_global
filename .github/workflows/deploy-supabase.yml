name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/deploy-supabase.ps1'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      SITE_URL: ${{ secrets.SITE_URL }}
      PRICE_ID_ARCHE: ${{ secrets.PRICE_ID_ARCHE }}
      PRICE_ID_ARENA: ${{ secrets.PRICE_ID_ARENA }}
      PRICE_ID_SCORE: ${{ secrets.PRICE_ID_SCORE }}
      PRICE_ID_FATE: ${{ secrets.PRICE_ID_FATE }}
      PRICE_ID_CODEX22: ${{ secrets.PRICE_ID_CODEX22 }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET SITE_URL PRICE_ID_ARCHE PRICE_ID_ARENA PRICE_ID_SCORE PRICE_ID_FATE PRICE_ID_CODEX22; do
            test -n "${!name:-}" || { echo "Missing GitHub secret: $name" >&2; exit 1; }
          done
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Set Edge Function secrets
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets set \
            "STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY" \
            "STRIPE_WEBHOOK_SECRET=$STRIPE_WEBHOOK_SECRET" \
            "SITE_URL=$SITE_URL" \
            "PRICE_ID_ARCHE=$PRICE_ID_ARCHE" \
            "PRICE_ID_ARENA=$PRICE_ID_ARENA" \
            "PRICE_ID_SCORE=$PRICE_ID_SCORE" \
            "PRICE_ID_FATE=$PRICE_ID_FATE" \
            "PRICE_ID_CODEX22=$PRICE_ID_CODEX22"
      - name: Deploy functions
        run: |
          supabase functions deploy create-checkout-session
          supabase functions deploy stripe-webhook
