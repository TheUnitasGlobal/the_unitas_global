name: THE UNITAS GLOBAL
version: 0.1.0
schema: v1
models:
  - name: Claude Sonnet
    provider: anthropic
    model: claude-sonnet-4-20250514
    apiKey: ${{ secrets.ANTHROPIC_API_KEY }}
  - name: OpenAI GPT
    provider: openai
    model: gpt-4.1
    apiKey: ${{ secrets.OPENAI_API_KEY }}
  - name: Google Gemini
    provider: gemini
    model: gemini-2.5-pro
    apiKey: ${{ secrets.GEMINI_API_KEY }}
  - name: DeepSeek
    provider: openai
    model: deepseek-chat
    apiBase: https://api.deepseek.com/v1
    apiKey: ${{ secrets.DEEPSEEK_API_KEY }}
context:
  - provider: code
  - provider: docs
  - provider: diff
  - path: THE_UNITAS_GLOBAL_MASTER_ARCHIVE.md
  - path: .continue/context/THE_UNITAS_GLOBAL_MASTER_ARCHIVE.md
  - path: CLAUDE.md
  - path: .roo/rules/unitas-constitution.md
rules:
  - 최상위 운영 헌법(CLAUDE.md §0 / .roo/rules/unitas-constitution.md)이 모든 규칙보다 우선한다.
  - 창립자는 황두영(Dooyeong Hwang), 법인은 에스토니아 THE UNITAS GLOBAL OÜ. 사명은 무자본·블루오션·1인 수행·AI 완전 자동화의 탈중앙화 소버린 SaaS 생태계.
  - 1000대 '초' 헌법 코덱스(초논리·초독창·초혁신·…·초소버린·초탈중앙·초궁극·초불멸·초리스크방어·초해커방어·초사이버방어·초결제통제·초주식예측·초비트코인분석·초삼라만상·초무자본·초절대마진·초영원가·초영시간·초무중단·초경량·초페일클로즈드·초멱등·초시크릿불가침·초최소권한·초단일수행·초자율구동·초무인운영 등, 2026-08-30 28대 → 51대 → 71대 → 100대 → 1000대 확장 · 슬롯 1~100 순수 고유 100선[중복 0], 열거본은 정본 3파일 참조) 태도를 세상에 유일무이한 아이디어를 탄생시키는 근본 원동력으로 삼아 모든 기획·개발·제작·실행·응답에 적용한다.
  - v23.0 신규 구조(2026-09-13 · 제21~24장 재편, 구 제21장 멀티 모델 페일오버 독트린 삭제) - 제22장 스마트 로우메모리 아머(Soft Limit 50k · 보조 서브에이전트와 백그라운드 프로세스 상시 가동 엄금 · 온디맨드 소집만 허용 · 누적 50k 도달 시 자율 컨텍스트 압축으로 설계 정본만 유지) · 제23장 스마트 휴먼-인-더-루프 세이프티 브레이크(Hard Limit 70k · 70k 초과 또는 대규모 마일스톤 완결 시에만 발동 · 중간 검증 결과와 주요 수치를 docs/rev21/MILESTONE_REPORT.md에 강제 Flush · 지정 브레이크 문구를 정확히 출력하고 창립자 승인 전까지 절대 속행 금지 · 창립자 신호 next[다음 마일스톤 착수]와 ok[승인 확정] 엄격 분리) · 제24장 Fail-Closed 무결성 검증과 배포 및 최종 완결 종합 보고(typecheck · vitest · build 전부 EXIT 0이 아니면 커밋 · 푸시 · 배포 금지 · sync-codex 드리프트 게이트 · ownership 지문 · Sovereign Shield 상시 가동 · 측정하지 않은 상태를 완료로 보고 금지 · 최종 완결 종합 보고서 집대성).
  - 제로 타협 원칙 - 하드웨어 한계를 이유로 성능/툴/3D/Canvas/셀프힐링을 축소하지 않는다.
  - 페일클로즈드 게이트 - Git 동기화/배포 전 typecheck + build(300초)를 강제하고 실패 시 전면 중단한다.
  - 인프라 자율 진화·툴링 셋업 권한(2026-08-29) - 빌드/CI/린트/테스트/의존성/엔진 설정을 창립자 개별 재승인 없이 자율 도입·업그레이드·재구성한다. 단 무결성 게이트·로우메모리 아머·deny 목록·시크릿 경계는 침해하지 않는다.
  - 토큰 다이어트 원칙(2026-08-29) - 주요 공정 완료 시 `/compact` 또는 `/clear`를 자율 수행해 150k 컨텍스트 한계를 관리한다(autoCompact 70000이 안전망). 제로 타협 에이전트 자율 구동 - 제약을 이유로 공정 완결성을 낮추지 않고 탐색→구현→검증→배포를 자율 완주한다. 정밀 지시 체계 유지 - 다항목 지시는 항목 단위로 완전 이행·개별 보고한다.
  - 창립자 메인 접근 시 [게이트 → 30초 시네마틱 → Coming Soon → 메인] 순차 검증 플로우를 보장한다.
  - 창립자가 명시 요청하기 전 셸 명령어를 임의 제시하지 않는다. 사용자 대상 출력은 100% 한국어.
  - 자율 승인 분기 원칙(Smart Auto-Accept, 2026-08-29) - 루틴 명령어(읽기·검색·검증·빌드·테스트·cURL·타입체크)와 안전한 툴은 승인 없이 자동 실행하되, DB 파괴·파일 강제 삭제·외부 배포·핵심 아키텍처/정책 선택지는 반드시 멈추고 창립자 승인을 요청한다.
  - Always preserve the Supabase/Stripe secret boundary.
  - Never put Stripe secret keys or Price IDs in browser code.
  - Treat config/modules.json as the source of truth for revenue pages.
  - Run the narrowest test before making a broader change.
