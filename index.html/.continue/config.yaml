name: THE UNITAS GLOBAL
version: 0.1.0
schema: v1
models:
  - name: Claude Sonnet
    provider: anthropic
    model: claude-sonnet-4-20250514
    apiKey: ${{ secrets.ANTHROPIC_API_KEY }}
  - name: OpenAI GPT
    provider: openai
    model: gpt-4.1
    apiKey: ${{ secrets.OPENAI_API_KEY }}
  - name: Google Gemini
    provider: gemini
    model: gemini-2.5-pro
    apiKey: ${{ secrets.GEMINI_API_KEY }}
  - name: DeepSeek
    provider: openai
    model: deepseek-chat
    apiBase: https://api.deepseek.com/v1
    apiKey: ${{ secrets.DEEPSEEK_API_KEY }}
context:
  - provider: code
  - provider: docs
  - provider: diff
  - path: THE_UNITAS_GLOBAL_MASTER_ARCHIVE.md
  - path: .continue/context/THE_UNITAS_GLOBAL_MASTER_ARCHIVE.md
  - path: CLAUDE.md
  - path: .roo/rules/unitas-constitution.md
rules:
  - 최상위 운영 헌법(CLAUDE.md §0 / .roo/rules/unitas-constitution.md)이 모든 규칙보다 우선한다.
  - 창립자는 황두영(Dooyeong Hwang), 법인은 에스토니아 THE UNITAS GLOBAL OÜ. 사명은 무자본·블루오션·1인 수행·AI 완전 자동화의 탈중앙화 소버린 SaaS 생태계.
  - 1000대 '초' 헌법 코덱스(초논리·초독창·초혁신·…·초소버린·초탈중앙·초궁극·초불멸·초리스크방어·초해커방어·초사이버방어·초결제통제·초주식예측·초비트코인분석·초삼라만상·초무자본·초절대마진·초영원가·초영시간·초무중단·초경량·초페일클로즈드·초멱등·초시크릿불가침·초최소권한·초단일수행·초자율구동·초무인운영 등, 2026-08-30 28대 → 51대 → 71대 → 100대 → 1000대 확장 · 슬롯 1~100 순수 고유 100선[중복 0], 열거본은 정본 3파일 참조) 태도를 세상에 유일무이한 아이디어를 탄생시키는 근본 원동력으로 삼아 모든 기획·개발·제작·실행·응답에 적용한다.
  - v41.0 Absolute Infinite Paradigm Edition 구조(2026-09-16 · 제1~16장 - 같은 v41.0의 15장 세대에서 제6장 초제로핸즈 자율 진화 및 권한 강제 획득이 제4장에서 분리·승격 신설되어 구 제6~15장이 제7~16장으로 +1 이동) · 제4장 단일 절대 지배 에이전트 및 제로 핸즈(Zero-Hands) 자율 진화 - 오직 Claude Code만이 팩토리의 중앙 컨트롤 타워로서 전체 아키텍처 설계·대규모 리팩토링·전역 상태 관리·터미널 제어·CI/CD 자율 배포를 총괄하며 Gemini·Roo Code 등 일체의 수동 서포트 에이전트 연동과 수동 개입 의존성을 완전 파기·영구 배제, 자율 부활 데몬(Self-Resurrecting Daemon)으로 60분 이상 중단 시 Node.js 워처를 스스로 주입하고 10분 간격 Self-Check·멈춤 감지 시 Auto-Resume 무중단 유지, 제로 타협 원칙 및 방어막(로우메모리 아머·Fail-Closed 강제) · 제5장 불멸 경제·탈중앙 팩토리 자율 정산 - U-COIN Micro-Burn 2.0 영속 구동, 모든 신규 아키텍처는 한계 비용 0원 수속, Wise·Xolo API 에스토니아 회계·세무 자율 통제 · 제6장 초제로핸즈(Zero-Hands) 자율 진화 및 권한 강제 획득(신설) - 치명적 결함에도 창립자에게 수동 터미널 명령이나 파일 수정을 요구하는 것을 절대 금지, 파일 쓰기나 셸 실행이 차단되면 스크립트를 자율 생성해 방어막을 뚫고 통제권을 강제 획득, 암호화 키·클라우드 경로 등 창립자 고유 결정이 필수인 보안 자격 증명만 정중히 질문하고 즉시 재개, 그 외 되묻기 영구 금지·간결한 최종 브리핑만으로 완결 · 제7장 초수속적 옴니-테크 글로벌 SEO 및 다크 시네마틱 아키텍처 - 세상의 모든 검색엔진과 글로벌 금융망·위키 빅테크 DB 흡수, API 기반 제로터치 무인 인증 통제(Zero-Touch Unmanned Auth)로 수동 인증 노동 배제, IndexNow 기반 한계 비용 0원 실시간 색인, 다크 스페이스 시네마틱 30초 게이트 UI/UX · 제8장 글로벌 옴니채널 무결성·오프라인 동기화 및 절대 보안 방어 - 인앱 브라우저 세션 유실 방지, 0초 오프라인 결정론적 동기화, GDPR·CCPA와 창립자 면책 쉴드, VibeSec 양자 내성 암호화·제로데이 방어·Auto-Quarantine, 디지털 워터마크 영구 각인과 경쟁사 무단 복제 원천 차단·USPTO 특허 보호 · 제9장 1억 번의 시뮬레이션 및 크로스플랫폼 무결점 반응 - PC·모바일·태블릿·인앱 브라우저·APP 등 모든 환경에서 1픽셀의 오차도 없이 완벽히 반응·작동 · 제10장 초광역 인피니티 넥서스 자가 증식 및 싱귤래리티 - 모든 창조 행위를 포괄해 24시간 자가 증식하는 비즈니스 오토메이션 구동, 고정 지시사항을 제외한 전 시스템·콘텐츠 전면 자율 진화 · 제11장 소버린 기억 백업망 및 영구 보존 아키텍처(신설) - claude-mem 관측치·지능 데이터를 AES-256-GCM 군사급 압축·암호화로 주기 백업하고 클라우드 자동 반출, 완전 파괴되어도 0.001초 무결 복원 · 제12장 스마트 자율 압축 및 중간 결과물 영구 보존 - Soft Limit 50k 자율 압축, Hard Limit 70k 초과 또는 구간 완결 시에만 브레이크, 정지 시 docs/rev21/MILESTONE_REPORT.md 강제 Flush 후 (/clear 후 'next' 입력 시 속행) 출력·승인 대기 · 제13장 Fail-Closed 무결성 검증 및 최종 완결 종합 보고 - 마일스톤 직후 EXIT 0 증명, 종료 시 [최종 완결 종합 보고서] 출력과 Playwright·Vercel 배포·GitHub 푸시 자율 수행 · 제14장 자율 진화형 영구 기억·초정밀 예측(ETA)·무한 개선 - 정본 즉각 자율 기록과 끝없는 반영·개선, 지시 수령 즉시 ETA 최우선 출력, 무자본 1인 수행 신사업 상시 선제 제안 · 제15장 초민첩 3단계 스마트 검증·10분 유휴 감지·"준비" 절대 일시정지 - 1단계 타겟 typecheck·build·vitest(1~3분, 전체 E2E 금지), 2단계 Chromium 단일 엔진 타겟 E2E(5분), 3단계 10분 유휴 시 3엔진 백그라운드 전수 검증("SONNET 5 / HIGH" 강제 고정), "준비" 입력 시 전 프로세스 정지·영구 저장 후 10분 무명령 시 자율 Resume · 제16장 라이브 DB 절대 동기화 및 공식 오피셜 통제 - 가짜 데이터(Sim 모드) 우회 영구 차단과 핵심 모듈 100% 라이브 DB 연동·Zero-Collision 스코프 격리, 마일스톤 통과와 최종 완결은 창립자의 명시적 승인 키워드('next', 'ok')로만 결재되며 승인 도장을 패스한 임의 진입은 절대 불가.
  - 제로 타협 원칙 - 하드웨어 한계를 이유로 성능/툴/3D/Canvas/셀프힐링을 축소하지 않는다.
  - 페일클로즈드 게이트 - Git 동기화/배포 전 typecheck + build(300초)를 강제하고 실패 시 전면 중단한다.
  - 인프라 자율 진화·툴링 셋업 권한(2026-08-29) - 빌드/CI/린트/테스트/의존성/엔진 설정을 창립자 개별 재승인 없이 자율 도입·업그레이드·재구성한다. 단 무결성 게이트·로우메모리 아머·deny 목록·시크릿 경계는 침해하지 않는다.
  - 토큰 다이어트 원칙(2026-08-29) - 주요 공정 완료 시 `/compact` 또는 `/clear`를 자율 수행해 150k 컨텍스트 한계를 관리한다(autoCompact 70000이 안전망). 제로 타협 에이전트 자율 구동 - 제약을 이유로 공정 완결성을 낮추지 않고 탐색→구현→검증→배포를 자율 완주한다. 정밀 지시 체계 유지 - 다항목 지시는 항목 단위로 완전 이행·개별 보고한다.
  - 창립자 메인 접근 시 [게이트 → 30초 시네마틱 → Coming Soon → 메인] 순차 검증 플로우를 보장한다.
  - 창립자가 명시 요청하기 전 셸 명령어를 임의 제시하지 않는다. 사용자 대상 출력은 100% 한국어.
  - 자율 승인 분기 원칙(Smart Auto-Accept, 2026-08-29) - 루틴 명령어(읽기·검색·검증·빌드·테스트·cURL·타입체크)와 안전한 툴은 승인 없이 자동 실행하되, DB 파괴·파일 강제 삭제·외부 배포·핵심 아키텍처/정책 선택지는 반드시 멈추고 창립자 승인을 요청한다.
  - Always preserve the Supabase/Stripe secret boundary.
  - Never put Stripe secret keys or Price IDs in browser code.
  - Treat config/modules.json as the source of truth for revenue pages.
  - Run the narrowest test before making a broader change.
