<svg xmlns="http://www.w3.org/2000/svg" viewBox="174 64 152 152" role="img" aria-labelledby="unitasMarkTitle">
  <title id="unitasMarkTitle">UNITAS</title>
  <defs>
    <filter id="softBlur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
    <filter id="extremeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="sparkFilter" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="1.4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="globeGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="triBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#002A2A" stop-opacity="1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="1" />
    </radialGradient>
    <radialGradient id="deepVoid" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#004D4D" stop-opacity="1" />
      <stop offset="100%" stop-color="#010103" stop-opacity="1" />
    </radialGradient>
    <radialGradient id="holoGlobe" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#E0FFFF" stop-opacity="1" />
      <stop offset="30%" stop-color="#00FFFF" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#008B8B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#002233" stop-opacity="0.95" />
    </radialGradient>
  </defs>

  <circle cx="250" cy="140" r="62" fill="#d4af37" opacity="0.14" filter="url(#softBlur)" />

  <g transform="translate(0, -40)">
    <polygon points="205,145 250,115 250,145 225,160" fill="#FFE47A" />
    <polygon points="250,115 295,145 275,160 250,145" fill="#E8C359" />
    <polygon points="205,215 205,145 225,160 225,200" fill="#C69A2B" />
    <polygon points="295,145 295,215 275,200 275,160" fill="#9A7017" />
    <polygon points="250,245 205,215 225,200 250,215" fill="#704D07" />
    <polygon points="295,215 250,245 250,215 275,200" fill="#4D3300" />
    <polygon points="225,160 250,145 275,160 275,200 250,215 225,200" fill="url(#deepVoid)" />

    <polygon points="250,154 278,206 222,206" fill="url(#triBg)" stroke="#00FFFF" stroke-width="2.5" filter="url(#extremeGlow)" />
    <polygon points="250,154 278,206 222,206" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-dasharray="8,12,15,6" filter="url(#sparkFilter)" />
    <polygon points="250,154 278,206 222,206" fill="none" stroke="#7FFFD4" stroke-width="3" stroke-dasharray="4,25,10,18" filter="url(#extremeGlow)" />

    <polygon points="250,157 270,168.5 270,191.5 250,203 230,191.5 230,168.5" fill="none" stroke="#7FFFD4" stroke-width="1.5" opacity="0.85" stroke-dasharray="4,2" />

    <path d="M 250 162 L 250 198" fill="none" stroke="#00FFFF" stroke-width="2.8" filter="url(#extremeGlow)" />
    <path d="M 238 162 L 238 176 L 250 180 L 262 184 L 262 198" fill="none" stroke="#00FFFF" stroke-width="2.8" filter="url(#extremeGlow)" />
    <circle cx="238" cy="162" r="4" fill="#FF0055" filter="url(#extremeGlow)" />
    <circle cx="262" cy="198" r="4" fill="#0055FF" filter="url(#extremeGlow)" />

    <g filter="url(#globeGlow)">
      <circle cx="250" cy="180" r="12.5" fill="url(#holoGlobe)" />
      <ellipse cx="250" cy="180" rx="12.5" ry="4.5" fill="none" stroke="#FFFFFF" stroke-width="0.7" opacity="0.6" />
      <ellipse cx="250" cy="180" rx="4.5" ry="12.5" fill="none" stroke="#FFFFFF" stroke-width="0.7" opacity="0.6" />
      <circle cx="250" cy="180" r="12.5" fill="none" stroke="#7FFFD4" stroke-width="1.1" opacity="0.8" />
    </g>
  </g>
</svg>
